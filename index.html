<body>
<nav class="et-bar" aria-label="現在地">
  <div class="et-bar-inner">
    <a class="et-home" href="https://edi-tool.github.io/"><span class="et-mark" aria-hidden="true"></span>edi-tool</a>
    <svg class="et-sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>
    <span class="et-current" aria-current="page">QRコードさん</span>
  </div>

    <main class="container">
        <h1>QRコードさん<span class="badge">社内向け</span></h1>
        <span class="subtitle">東洋館EC用・書籍の二次元コード作成ツール</span>

        <label class="instruction" for="skuInput">4桁のSKUを入力</label>
        <input type="text" id="skuInput" placeholder="例: 1234" maxlength="4" inputmode="numeric" autocomplete="off" aria-describedby="errorMsg" onkeydown="if(event.key==='Enter') generateQRCode()">
        <div id="errorMsg" class="error-msg" role="alert" aria-live="polite"></div>

        <button type="button" class="btn btn-primary" onclick="generateQRCode()">QRコードを作成</button>

        <div id="urlDisplay" class="url-display"></div>
        <div id="qrcode-container"></div>

        <div id="downloadBtn">
            <a id="downloadLink" class="btn btn-ghost" href="#" download="qrcode.png"><span class="et-i et-i-arrow-down" aria-hidden="true"></span>画像をダウンロード（PNG）</a>
        </div>
    </main>

    <footer>
        <a href="https://edi-tool.github.io/"><span class="et-i et-i-chevron-left" aria-hidden="true"></span>edi-tool ツール一覧</a> | &copy; 2026 ISHIKAWA, Natsuki | MIT License
        <span class="trademark">※QRコードは株式会社デンソーウェーブの登録商標です</span>
    </footer>

    <script>
        // 全角数字を半角に変換する関数
        function normalizeNumber(str) {
            return str.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
        }

        function generateQRCode() {
            let sku = document.getElementById("skuInput").value;
            const errorMsg = document.getElementById("errorMsg");
            const qrcodeContainer = document.getElementById("qrcode-container");
            const urlDisplay = document.getElementById("urlDisplay");
            const downloadLink = document.getElementById("downloadLink");
            const downloadBtn = document.getElementById("downloadBtn");

            // 全角数字を半角に正規化
            sku = normalizeNumber(sku);

            // 初期化
            errorMsg.textContent = "";
            urlDisplay.textContent = "";
            qrcodeContainer.innerHTML = ""; 
            downloadBtn.style.display = "none";

            // バリデーション
            if (!/^\d{4}$/.test(sku)) {
                errorMsg.textContent = "4桁の数字を正しく入力してください。";
                return;
            }

            const targetUrl = "https://www.toyokan.co.jp/products/" + sku;

            // 印刷用QRコードの設定
            const opts = {
                errorCorrectionLevel: 'H', // 誤り訂正レベル最高
                margin: 4,                 // ★周辺の余白を標準規格の4ブロック分に変更
                width: 1600,               // 1600px 四方（40mm で配置すると約 1000dpi 相当）
                color: {
                    dark: '#000000ff',     // モノクロ（黒）
                    light: '#ffffffff'     // モノクロ（白）
                }
            };

            // QRコードをDataURL(PNG形式)として生成
            QRCode.toDataURL(targetUrl, opts, function (err, url) {
                if (err) {
                    errorMsg.textContent = "二次元コードの生成に失敗しました。";
                    console.error(err);
                    return;
                }

                // 画面に画像を表示
                const img = document.createElement('img');
                img.src = url;
                img.alt = `SKU ${sku} の二次元コード`;
                qrcodeContainer.appendChild(img);

                // 確認用URLを表示
                urlDisplay.innerHTML = `リンク先: <br><a href="${targetUrl}" target="_blank" rel="noopener">${targetUrl}</a>`;

                // ダウンロードボタンのリンク先に設定して表示
                downloadLink.href = url;
                downloadLink.download = `QR_SKU${sku}.png`; 
                downloadBtn.style.display = "block";
            });
        }
    </script>
